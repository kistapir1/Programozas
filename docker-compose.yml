services:
  db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_DB: menetrend_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ./GTFS:/GTFS:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d menetrend_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: menetrend-backend
    environment:
      DB_HOST: db
      DB_NAME: menetrend_db
      DB_USER: postgres
      DB_PASSWORD: password
      DB_PORT: "5432"
      # Tokenek aláírókulcsa – élesben .env fájlból vagy titokkezelőből jöjjön!
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-3f9a1c7e5b2d4a6f8e0c1b3d5f7a9c2e}
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./GTFS:/GTFS:ro
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
